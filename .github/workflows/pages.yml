name: Deploy Dashboard

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "scraper/**"
      - "config/**"
      - ".github/workflows/pages.yml"
      - ".nojekyll"
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-scrape
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install -r requirements.txt

      - name: Scrape and normalize promotions
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python scraper/run.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit refreshed promotion data
        run: |
          git config user.name "promotion-tracker[bot]"
          git config user.email "promotion-tracker[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update promotion data"
            git pull --rebase origin main
            git push
          fi
