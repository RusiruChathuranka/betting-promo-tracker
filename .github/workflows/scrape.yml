name: Scrape Promotions

on:
  workflow_dispatch:
  push:
    paths:
      - "scraper/**"
      - "config/**"
      - ".github/workflows/scrape.yml"
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

concurrency:
  group: scrape-promotions
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape and normalize promotions
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python scraper/run.py

      - name: Commit updated data
        run: |
          git config user.name "promotion-tracker[bot]"
          git config user.email "promotion-tracker[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git pull --rebase origin main
            git add data/
            git commit -m "Update promotion data"
            git push
          fi
